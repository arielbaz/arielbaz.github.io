name: Publication automatique

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/**'
      - 'assets/css/**'
      - 'assets/js/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Générer le site
        run: node tools/build.mjs

      - name: Publier si le site a changé
        run: |
          git config user.name "ARIBAZ (bot)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à publier."
          else
            git commit -m "build: régénération automatique [skip ci]"
            git push
          fi
